name: PR title

# Pull requests are squash-merged, so the title becomes the commit release-please reads:
# it must be a Conventional Commit (`feat: …`, `fix(react): …`, `feat!: …`).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
