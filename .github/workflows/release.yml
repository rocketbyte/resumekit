name: Release

on:
  push:
    branches: [main]
  # Publishes whatever version is on `main` and not yet on npm. Used once, for the first
  # release, which has to exist before trusted publishing can be configured for it.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Reads the Conventional Commits merged since the last release and keeps one release pull
  # request up to date: the next version (fix → patch, feat → minor, breaking → minor while
  # below 1.0), both packages' versions and changelogs. Merging that pull request tags the
  # release and creates the GitHub releases.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing: the registry trusts this workflow's OIDC token, so no npm
      # token is stored, and provenance is attached to every version.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: scripts/publish.sh
        env:
          # Empty once trusted publishing is configured, and then npm authenticates with the
          # workflow's OIDC token. Only the first release, before a package exists, needs it.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
