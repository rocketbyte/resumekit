# Engineer: Jake's Resume — docs/template-references/engineer.png.
# Centred name over one pipe-separated contact line, small-capital headings over
# a full-width rule, entries as four corners, projects as custom sections.
id: engineer
component: Engineer
prefix: tpl-engineer
styleKey: eng

layout:
  - stack:
      - name
      - headline
      - { contact: [phone, email, location], links: true }
    tag: header
    class: head
    block: true
  - summary
  - education
  - experience
  - custom
  - { section: skills, title: technicalSkills, groups: grid }
  - achievements
  - courses
  - { section: certifications, as: bullets }
  - { section: languages, sectionClass: languages }
  - passions

entries:
  experience:
    name: ExperienceEntry
    type: Experience
    root: { tag: article, class: entry, block: true }
    children:
      - tag: div
        class: corners
        children:
          - { tag: span, class: title, children: [{ field: title }] }
          - tag: span
            class: dates
            children:
              - { field: start }
              - { text: ' – ' }
              - { field: end }
          - { tag: span, class: org, children: [{ field: company }] }
          - {
              tag: span,
              class: place,
              children: [{ field: location, optional: true }],
            }
      - { bullets: bullets }

  education:
    name: EducationEntry
    type: Education
    root: { tag: article, class: entry, block: true }
    children:
      - tag: div
        class: corners
        children:
          - { tag: span, class: title, children: [{ field: school }] }
          - {
              tag: span,
              class: where,
              children: [{ field: location, optional: true }],
            }
          - tag: span
            class: org
            children:
              - { field: degree, optional: true }
              - { word: degreeField, between: [degree, field] }
              - { field: field, optional: true }
          - tag: span
            class: place
            children:
              - { field: start, optional: true }
              - { separator: ' – ', between: [start, end] }
              - { field: end, optional: true }

  custom:
    name: CustomEntry
    type: CustomEntry
    root: { tag: article, class: entry, block: true }
    children:
      - tag: p
        class: project
        children:
          - {
              tag: span,
              class: title,
              children: [{ field: title, placeholder: heading }],
            }
          - { separator: ' | ', between: [title, detail] }
          - {
              tag: span,
              class: stack,
              children: [{ field: detail, optional: true }],
            }
      - { bullets: bullets }
