# Crimson: Awesome CV — docs/template-references/crimson.png.
id: crimson
component: Crimson
prefix: tpl-crimson
styleKey: crm
headingAccent: 3

layout:
  - stack:
      - { name: name, split: true }
      - headline
      - { contact: [location], item: false, class: address }
      - { contact: [phone, email], links: true, icons: true }
    tag: header
    class: head
    block: true
  - summary
  - experience
  - education
  - { section: skills, groups: grid }
  - achievements
  - courses
  - { section: languages, sectionClass: languages }
  - { section: certifications, as: bullets, split: true }
  - passions
  - custom

entries:
  experience:
    name: ExperienceEntry
    type: Experience
    root: { tag: article, class: entry, block: true }
    children:
      - tag: div
        class: entry-head
        children:
          - { tag: p, class: org, children: [{ field: company }] }
          - {
              tag: p,
              class: where,
              children: [{ field: location, optional: true }],
            }
          - { tag: p, class: role, children: [{ field: title }] }
          - tag: p
            class: dates
            children:
              - { field: start }
              - { text: ' - ' }
              - { field: end }
      - { bullets: bullets }

  education:
    name: EducationEntry
    type: Education
    root: { tag: article, class: entry, block: true }
    children:
      - tag: div
        class: entry-head
        children:
          - { tag: p, class: org, children: [{ field: school }] }
          - {
              tag: p,
              class: where,
              children: [{ field: location, optional: true }],
            }
          - tag: p
            class: role
            children:
              - { field: degree, optional: true }
              - { word: degreeField, between: [degree, field] }
              - { field: field, optional: true }
          - tag: p
            class: dates
            children:
              - { field: start, optional: true }
              - { separator: ' - ', between: [start, end] }
              - { field: end, optional: true }

  custom:
    name: CustomEntry
    type: CustomEntry
    root: { tag: article, class: entry, block: true }
    children:
      - tag: div
        class: entry-head
        children:
          - {
              tag: p,
              class: org,
              children: [{ field: title, placeholder: heading }],
            }
          - {
              tag: p,
              class: role,
              children: [{ field: detail, optional: true }],
            }
      - { bullets: bullets }
