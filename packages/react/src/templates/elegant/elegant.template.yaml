id: elegant
component: Elegant
prefix: tpl-elegant
styleKey: el

layout:
  - row:
      - stack:
          - stack:
              - stack:
                  - name
                  - headline
                  - row:
                      - {
                          contact: [phone],
                          class: phone,
                          item: false,
                          icons: true,
                        }
                      - {
                          contact: [email],
                          class: email,
                          item: false,
                          icons: true,
                        }
                      - stack:
                          - { links: links, icons: true }
                        class: link-line
                        when: links
                      - {
                          contact: [location],
                          class: place,
                          item: false,
                          icons: true,
                        }
                    class: contact
                class: identity
            tag: header
            class: head-block
            block: true
          - summary
          - experience
          - education
          - languages
        class: main
      - stack:
          - avatar
          - { section: achievements, kit: [tpl-described--marked] }
          - custom
          - { section: skills, groups: grid }
          - courses
          - {
              section: certifications,
              as: bullets,
              split: true,
              whenEmpty: hide,
            }
          - { section: passions, kit: [tpl-described--marked] }
        tag: aside
        class: aside
    class: body
    kit: [tpl-sheet-tall]

entries:
  experience:
    name: ExperienceEntry
    type: Experience
    root:
      tag: article
      class: entry
      block: true
    children:
      - tag: div
        class: entry-head
        children:
          - tag: p
            class: role
            children:
              - field: title
          - tag: p
            class: dates
            children:
              - field: start
              - text: ' - '
              - field: end
          - tag: p
            class: org
            children:
              - field: company
          - tag: p
            class: where
            children:
              - field: location
                optional: true
      - bullets: bullets
  education:
    name: EducationEntry
    type: Education
    root:
      tag: article
      class: entry
      block: true
    children:
      - tag: div
        class: entry-head
        children:
          - tag: p
            class: role
            children:
              - field: degree
                optional: true
              - word: degreeField
                between:
                  - degree
                  - field
              - field: field
                optional: true
          - tag: p
            class: dates
            children:
              - field: start
                optional: true
              - separator: ' - '
                between:
                  - start
                  - end
              - field: end
                optional: true
          - tag: p
            class: org
            children:
              - field: school
          - tag: p
            class: where
            children:
              - field: location
                optional: true
  custom:
    name: CustomEntry
    type: CustomEntry
    root:
      tag: article
      class: note
      block: true
    children:
      - tag: p
        class: note-title
        children:
          - field: title
            placeholder: heading
      - tag: p
        class: note-detail
        children:
          - field: detail
            optional: true
      - bullets: bullets
