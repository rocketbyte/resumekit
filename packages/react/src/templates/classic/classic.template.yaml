id: classic
component: Classic
prefix: tpl-classic
styleKey: cl

layout:
  - stack: [name, headline, { contact: [phone, email, location], links: true }]
    tag: header
    class: head-block
    block: true
  - summary
  - experience
  - education
  - { section: achievements, kit: [tpl-described--grid] }
  - custom
  - { section: skills, groups: grid }
  - courses
  - languages
  - { section: certifications, as: bullets, split: true, whenEmpty: hide }
  - passions

entries:
  experience:
    name: ExperienceEntry
    type: Experience
    root:
      tag: article
      class: entry
      block: true
    children:
      - tag: div
        class: head
        children:
          - tag: div
            children:
              - tag: p
                class: lead
                children:
                  - field: title
              - tag: p
                class: support
                children:
                  - field: company
          - tag: div
            class: aside
            children:
              - tag: p
                class: place
                children:
                  - field: location
                    optional: true
              - tag: p
                class: dates
                children:
                  - field: start
                  - text: ' - '
                  - field: end
      - bullets: bullets
  education:
    name: EducationEntry
    type: Education
    root:
      tag: article
      class: entry
      block: true
    children:
      - tag: div
        class: head
        children:
          - tag: div
            children:
              - tag: p
                class: lead
                children:
                  - field: degree
                    optional: true
                  - word: degreeField
                    between:
                      - degree
                      - field
                  - field: field
                    optional: true
              - tag: p
                class: school
                children:
                  - field: school
          - tag: div
            class: aside
            children:
              - tag: p
                class: place
                children:
                  - field: location
                    optional: true
              - tag: p
                class: dates
                children:
                  - field: start
                    optional: true
                  - separator: ' - '
                    between:
                      - start
                      - end
                  - field: end
                    optional: true
  custom:
    name: CustomEntry
    type: CustomEntry
    root:
      tag: article
      class: note
      block: true
    children:
      - tag: p
        class: note-title
        children:
          - field: title
            placeholder: heading
      - tag: p
        class: note-detail
        children:
          - field: detail
            optional: true
      - bullets: bullets
