id: polished
component: Polished
prefix: tpl-polished
styleKey: po

layout:
  - row:
      - stack:
          - { name: name, block: true }
          - { section: achievements, kit: [tpl-described--marked] }
          - custom
          - courses
          - {
              section: certifications,
              as: bullets,
              split: true,
              whenEmpty: hide,
            }
          - { section: passions, kit: [tpl-described--marked] }
        tag: aside
        class: aside
      - stack:
          - stack:
              - stack:
                  [
                    headline,
                    {
                      contact: [phone, email, location],
                      links: true,
                      icons: true,
                    },
                  ]
                class: identity
            tag: header
            class: head-block
            block: true
          - summary
          - experience
          - education
          - { section: skills, groups: grid }
          - languages
        class: main
    class: body
    kit: [tpl-sheet-tall]

entries:
  experience:
    name: ExperienceEntry
    type: Experience
    root:
      tag: article
      class: entry
      block: true
    children:
      - tag: div
        class: head
        children:
          - { tag: span, class: role, children: [{ field: title }] }
          - tag: span
            class: dates
            children:
              - { field: start }
              - { text: ' - ' }
              - { field: end }
          - { tag: span, class: org, children: [{ field: company }] }
          - {
              tag: span,
              class: where,
              children: [{ field: location, optional: true }],
            }
      - bullets: bullets
  education:
    name: EducationEntry
    type: Education
    root:
      tag: article
      class: entry
      block: true
    children:
      - tag: div
        class: head
        children:
          - tag: span
            class: role
            children:
              - { field: degree, optional: true }
              - { word: degreeField, between: [degree, field] }
              - { field: field, optional: true }
          - tag: span
            class: dates
            children:
              - { field: start, optional: true }
              - { separator: ' - ', between: [start, end] }
              - { field: end, optional: true }
          - { tag: span, class: org, children: [{ field: school }] }
          - {
              tag: span,
              class: where,
              children: [{ field: location, optional: true }],
            }
  custom:
    name: CustomEntry
    type: CustomEntry
    root:
      tag: article
      class: note
      block: true
    children:
      - tag: p
        class: note-title
        children:
          - field: title
            placeholder: heading
      - tag: p
        class: note-detail
        children:
          - field: detail
            optional: true
      - bullets: bullets
