# Split — after Deedy Resume (docs/template-references/split.png): an
# oversized light name over centred contact lines and a hairline the width of
# the page, then a narrow column beside the work history. The narrow column is
# written first, so extracted text reads it first.
id: split
component: Split
prefix: tpl-split
styleKey: sp

layout:
  - stack:
      - { name: name, split: true }
      - headline
      - { contact: [location], class: contact }
      - { contact: [email, phone], class: contact }
    tag: header
    class: head
    block: true
  - row:
      - stack:
          - education
          - stack:
              - { links: links, split: true }
            tag: section
            class: section
            heading: links
            when: links
          - { section: courses, sectionClass: courses }
          - section: skills
            groups: tags
          - languages
          - { section: certifications, as: bullets, split: true }
          - passions
        tag: aside
        class: aside
      - stack:
          - summary
          - experience
          - achievements
          - custom
        class: main
    class: body

entries:
  # The organisation in bold capitals, the role after a pipe in small
  # capitals, then the dates and the place on a line of their own.
  experience:
    name: ExperienceEntry
    type: Experience
    root: { tag: article, class: entry, block: true }
    children:
      - tag: p
        class: lead
        children:
          - { tag: span, class: org, children: [{ field: company }] }
          - { separator: ' | ', between: [company, title] }
          - { tag: span, class: role, children: [{ field: title }] }
      - tag: p
        class: meta
        children:
          - { field: start }
          - { text: ' – ' }
          - { field: end }
          - { separator: ' | ', between: [end, location] }
          - { field: location, optional: true }
      - { bullets: bullets }

  education:
    name: EducationEntry
    type: Education
    root: { tag: article, class: entry, block: true }
    children:
      - { tag: p, class: org, children: [{ field: school }] }
      - tag: p
        class: role
        children:
          - { field: degree, optional: true }
          - { word: degreeField, between: [degree, field] }
          - { field: field, optional: true }
      - tag: p
        class: meta
        children:
          - { field: start, optional: true }
          - { separator: ' – ', between: [start, end] }
          - { field: end, optional: true }
          - { separator: ' | ', between: [end, location] }
          - { field: location, optional: true }

  custom:
    name: CustomEntry
    type: CustomEntry
    root: { tag: article, class: entry, block: true }
    children:
      - {
          tag: p,
          class: org,
          children: [{ field: title, placeholder: heading }],
        }
      - { tag: p, class: meta, children: [{ field: detail, optional: true }] }
      - { bullets: bullets }
